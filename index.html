ound:#111814}.title{font-size:28px;margin:0 0 8px}.subtitle{color:#b9c8c1}.achievement{position:absolute;right:12px;bottom:12px;padding:9px 12px;max-width:280px;opacity:0;transform:translateY(10px);transition:.2s}.achievement.show{opacity:1;transform:translateY(0)}

<script>
(() => {
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W=innerWidth,H=innerHeight,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
const keys=new Set(),mouse={x:W/2,y:H/2,down:false};
addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault();if(e.key.toLowerCase()==='b')toggleShop();if(e.key.toLowerCase()==='g')throwGrenade();if(e.key==='Escape')closeOverlays()});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
canvas.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});canvas.addEventListener('mousedown',e=>{if(e.button===0)mouse.down=true});addEventListener('mouseup',e=>{if(e.button===0)mouse.down=false});
const ui={hpText:document.getElementById('hpText'),hpBar:document.getElementById('hpBar'),xpText:document.getElementById('xpText'),xpBar:document.getElementById('xpBar'),stats:document.getElementById('stats'),weaponText:document.getElementById('weaponText'),ammoText:document.getElementById('ammoText'),dashText:document.getElementById('dashText'),grenadeText:document.getElementById('grenadeText'),message:document.getElementById('message'),achievement:document.getElementById('achievement'),levelPanel:document.getElementById('levelPanel'),levelCards:document.getElementById('levelCards'),shopPanel:document.getElementById('shopPanel'),shopTimer:document.getElementById('shopTimer'),shopGrid:document.getElementById('shopGrid'),startNext:document.getElementById('startNext'),gameOverPanel:document.getElementById('gameOverPanel'),gameOverStats:document.getElementById('gameOverStats'),menuPanel:document.getElementById('menuPanel')};
const WORLD={w:2600,h:1800};
let state='menu',wave=1,waveKills=0,waveTotal=0,waveTransition=false,shopUntil=0,endless=false,score=0,coins=0,kills=0,totalKills=Number(localStorage.getItem('zo_kills')||0),dna=Number(localStorage.getItem('zo_dna')||0),level=1,xp=0,xpNeed=100,spawnTimer=0,last=performance.now(),camera={x:0,y:0},shake=0,messageUntil=0,selectedWeapon=1,particles=[],bullets=[],zombies=[],drops=[],texts=[],walls=[],grenades=[],burnZones=[],powerups=[],boss=null,dashTimer=0,attackTimer=0,reloadTimer=0,fireTimer=0,invuln=0,playTime=0,phase=1,achievementTimer=0;
const player={x:1300,y:900,r:17,hp:100,maxHp:100,speed:250,damage:1,fireRate:1,moveBoost:1,burnBoost:1,dashCooldown:0,dashTime:0,meleeDamage:42,grenades:3,mag:{1:12,2:30,3:6,4:24,5:5},maxMag:{1:12,2:30,3:6,4:24,5:5}};
const weapons={
1:{name:'Pistol',rate:260,damage:22,spread:.035,shots:1,speed:900,color:'#e8e0c5'},
2:{name:'SMG',rate:85,damage:11,spread:.11,shots:1,speed:1000,color:'#d7e8e0'},
3:{name:'Shotgun',rate:650,damage:12,spread:.24,shots:7,speed:820,color:'#f2d9a3'},
4:{name:'Flamethrower',rate:90,damage:2,spread:.20,shots:1,speed:450,color:'#ff8b28',range:330},
5:{name:'Sniper',rate:1050,damage:105,spread:.008,shots:1,speed:1400,color:'#8fc9ff',pierce:3}
};
let owned={1:true,2:true,3:true,4:false,5:false};
const upgrades=[
['damage','💥 伤害 +15%','所有武器伤害提高 15%'],['rate','⚡ 攻速 +12%','射击间隔缩短 12%'],['hp','❤️ 最大 HP +20','立即回复 20 HP'],['speed','🏃 移速 +12%','移动速度提高 12%'],['burn','🔥 燃烧强化','灼烧伤害 +50%，持续时间 +35%'],['coins','💰 金币 +20%','击杀获得更多金币'],['dash','⚡ 冲刺强化','Dash 冷却减少 25%'],['melee','⚔️ 近战强化','近战伤害 +20%']];
function resetGame(){state='playing';wave=1;waveKills=0;waveTotal=0;waveTransition=false;shopUntil=0;score=0;coins=0;kills=0;level=1;xp=0;xpNeed=100;spawnTimer=0;particles=[];bullets=[];zombies=[];drops=[];texts=[];grenades=[];burnZones=[];powerups=[];boss=null;selectedWeapon=1;owned={1:true,2:true,3:true,4:false,5:false};Object.assign(player,{x:1300,y:900,hp:100,maxHp:100,speed:250,damage:1,fireRate:1,moveBoost:1,burnBoost:1,dashCooldown:0,dashTime:0,meleeDamage:42,grenades:3});for(const k in player.mag)player.mag[k]=player.maxMag[k];walls=[];makeMap();ui.menuPanel.classList.add('hidden');ui.gameOverPanel.classList.add('hidden');ui.shopPanel.classList.add('hidden');ui.levelPanel.classList.add('hidden');startWave();}
function makeMap(){walls=[];const layout=wave%4;for(let i=0;i<15;i++){let x=250+((i*347+layout*130)%2000),y=180+((i*229+layout*210)%1300);let w=100+(i%3)*55,h=70+(i%4)*35;let r={x,y,w,h};if(Math.abs(x-1300)<250&&Math.abs(y-900)<220)continue;walls.push(r)}}
function startWave(){if(state!=='playing')return;waveKills=0;waveTotal=endless?12+Math.floor(wave*3.5):10+wave*3;spawnTimer=650;phase=1;showMessage((wave%5===0?'👑 BOSS WAVE ':'🌊 WAVE ')+wave,1800);if(wave%5===0)setTimeout(()=>{if(state==='playing')spawnBoss()},900)}
function startShop(){state='shop';shopUntil=performance.now()+7000;ui.shopPanel.classList.remove('hidden');renderShop();}
function toggleShop(){if(state==='shop')return;if(waveTransition)startShop()}
function renderShop(){const items=[['grenade','💣 手雷','+$1颗手雷',60,()=>player.grenades++],['damage','💥 Damage +10%','永久强化',120,()=>player.damage*=1.1],['rate','⚡ Fire Rate +10%','永久强化',120,()=>player.fireRate*=1.1],['speed','🏃 Speed +8%','永久强化',100,()=>player.moveBoost*=1.08],['hp','❤️ Max HP +15','永久强化',110,()=>{player.maxHp+=15;player.hp=Math.min(player.maxHp,player.hp+15)}],['flame','🔥 解锁喷火枪','本局解锁',180,()=>owned[4]=true],['sniper','🎯 解锁狙击枪','本局解锁',220,()=>owned[5]=true],['heal','🩹 医疗包','回复 40 HP',75,()=>player.hp=Math.min(player.maxHp,player.hp+40)]];ui.shopGrid.innerHTML='';for(const [id,n,d,c,fn] of items){const el=document.createElement('div');el.className='shopItem'+(coins<c?' disabled':'');el.innerHTML=`<b>${n}</b><br><span class="small">${d}</span><br><strong>💰 ${c}</strong>`;el.onclick=()=>{if(coins>=c){coins-=c;fn();renderShop();showMessage('购买成功',700)}};ui.shopGrid.appendChild(el)}}
ui.startNext.onclick=()=>{if(state==='shop'){state='playing';ui.shopPanel.classList.add('hidden');wave++;waveTransition=false;startWave()}};
function endWave(){if(waveTransition)return;waveTransition=true;coins+=50;showMessage('🎉 WAVE COMPLETE +$50',1600);setTimeout(()=>{if(state==='playing')startShop()},1700)}
function spawnPoint(){const side=Math.floor(Math.random()*4),m=75;return side===0?{x:m+Math.random()*(WORLD.w-2*m),y:m}:side===1?{x:WORLD.w-m,y:m+Math.random()*(WORLD.h-2*m)}:side===2?{x:m+Math.random()*(WORLD.w-2*m),y:WORLD.h-m}:{x:m,y:m+Math.random()*(WORLD.h-2*m)}}
function blocked(x,y,r){if(x<r+15||y<r+15||x>WORLD.w-r-15||y>WORLD.h-r-15)return true;for(const a of walls)if(x+r>a.x&&x-r<a.x+a.w&&y+r>a.y&&y-r<a.y+a.h)return true;return false}
function moveEntity(o,vx,vy,dt){const nx=o.x+vx*dt,ny=o.y+vy*dt;if(!blocked(nx,o.y,o.r))o.x=nx;if(!blocked(o.x,ny,o.r))o.y=ny}
function spawnZombie(type){let p=spawnPoint();let tries=0;while(blocked(p.x,p.y,22)&&tries++<20)p=spawnPoint();const defs={normal:[28,52,105,'#668f6b'],fast:[20,92,75,'#d2a044'],tank:[38,35,300,'#53616b'],exploder:[25,55,95,'#bf6b35'],hunter:[22,120,115,'#9c5a9a'],spitter:[24,48,120,'#4c9b85'],leaper:[23,100,130,'#b58a42']};const d=defs[type]||defs.normal;zombies.push({x:p.x,y:p.y,r:d[0],speed:d[1],damage:d[2],hp:d[2],maxHp:d[2],type,color:d[3],attack:0,burnUntil:0,burnTick:0,stun:0,wander:Math.random()*6,jump:0})}
function spawnRandomZombie(){let r=Math.random(),type=r<.48?'normal':r<.65?'fast':r<.77?'hunter':r<.86?'spitter':r<.93?'tank':r<.97?'leaper':'exploder';spawnZombie(type)}
function spawnBoss(){if(boss||state!=='playing')return;const p=spawnPoint();boss={x:p.x,y:p.y,r:58,hp:900+wave*180,maxHp:900+wave*180,attack:0,shoot:0,phase:1,flash:0};showMessage('👑 BOSS INCOMING!',2200)}
function aim(){return Math.atan2(mouse.y-(player.y-camera.y),mouse.x-(player.x-camera.x))}
function shoot(){if(state!=='playing'||reloadTimer>0)return;const w=weapons[selectedWeapon];if(!owned[selectedWeapon]){showMessage('🔒 请在 Wave 商店购买',800);return}if(player.mag[selectedWeapon]<=0){reloadTimer=1000;showMessage('🔄 自动换弹...',650);return}const a=aim();player.mag[selectedWeapon]--;fireTimer=w.rate/player.fireRate;for(let i=0;i<w.shots;i++){const ang=a+(Math.random()-.5)*w.spread;bullets.push({x:player.x+Math.cos(ang)*22,y:player.y+Math.sin(ang)*22,vx:Math.cos(ang)*w.speed,vy:Math.sin(ang)*w.speed,life:900,damage:w.damage*player.damage,type:selectedWeapon,pierce:w.pierce||1,hit:new Set()})}if(selectedWeapon===4){for(let i=0;i<5;i++){const ang=a+(Math.random()-.5)*.45;bullets.push({x:player.x,y:player.y,vx:Math.cos(ang)*450,vy:Math.sin(ang)*450,life:700,damage:2*player.damage,type:4,pierce:99,hit:new Set()})}}
}
function melee(){if(state!=='playing'||attackTimer>0)return;attackTimer=520;const a=aim();for(const z of zombies){const dx=z.x-player.x,dy=z.y-player.y,d=Math.hypot(dx,dy);let da=Math.atan2(dy,dx)-a;da=Math.atan2(Math.sin(da),Math.cos(da));if(d<86&&Math.abs(da)<.85){damageZombie(z,player.meleeDamage*player.damage*.95);z.stun=260;z.x+=Math.cos(a)*24;z.y+=Math.sin(a)*24}}for(let i=0;i<15;i++)particles.push({x:player.x+Math.cos(a)*60,y:player.y+Math.sin(a)*60,vx:(Math.random()-.5)*150,vy:(Math.random()-.5)*150,life:280,color:'#f1e5c0',size:2+Math.random()*3})}
function dash(){if(state!=='playing'||player.dashCooldown>0)return;let dx=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0),dy=(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0);if(!dx&&!dy){dx=Math.cos(aim());dy=Math.sin(aim())}const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;player.dashTime=230;player.dashCooldown=2200;player._dx=dx;player._dy=dy;player.x=Math.max(30,Math.min(WORLD.w-30,player.x+dx*150));player.y=Math.max(30,Math.min(WORLD.h-30,player.y+dy*150));if(blocked(player.x,player.y,player.r)){player.x-=dx*150;player.y-=dy*150}}
function throwGrenade(){if(state!=='playing'||player.grenades<=0)return;const a=aim();player.grenades--;grenades.push({x:player.x,y:player.y,vx:Math.cos(a)*480,vy:Math.sin(a)*480,life:700});}
function damagePlayer(n){if(invuln>0||state!=='playing')return;player.hp-=n;invuln=380;shake=8;texts.push({x:player.x,y:player.y-30,t:'-'+Math.round(n),life:650,color:'#ff6d6d'});if(player.hp<=0)gameOver()}
function damageZombie(z,n){if(z.hp<=0)return;z.hp-=n;z.flash=90;texts.push({x:z.x,y:z.y-z.r-8,t:Math.round(n),life:520,color:'#fff'});if(z.hp<=0)killZombie(z)}
function killZombie(z){z.hp=-999;kills++;totalKills++;localStorage.setItem('zo_kills',totalKills);score+=100;coins+=Math.floor(6+Math.random()*8);waveKills++;gainXP(20+(z.type==='tank'?20:0));if(Math.random()<.18){const types=['hp','grenade','coin','ammo'];drops.push({x:z.x,y:z.y,type:types[Math.floor(Math.random()*types.length)],life:15000})}if(Math.random()<.025)powerups.push({x:z.x,y:z.y,type:['rage','freeze','heal','insta'][Math.floor(Math.random()*4)],life:12000});for(let i=0;i<14;i++)particles.push({x:z.x,y:z.y,vx:(Math.random()-.5)*180,vy:(Math.random()-.5)*180,life:400,color:z.type==='exploder'?'#ff7a30':'#8b302f',size:2+Math.random()*4});if(z.type==='exploder'){for(const q of zombies){if(q!==z&&Math.hypot(q.x-z.x,q.y-z.y)<100)damageZombie(q,45*player.damage)}}}
function gainXP(n){xp+=n;while(xp>=xpNeed){xp-=xpNeed;xpNeed=Math.floor(xpNeed*1.18);level++;showLevelUp()}}
function showLevelUp(){state='level';ui.levelPanel.classList.remove('hidden');ui.levelCards.innerHTML='';const opts=[...upgrades].sort(()=>Math.random()-.5).slice(0,3);for(const [id,n,d] of opts){const c=document.createElement('div');c.className='card';c.innerHTML=`<b>${n}</b><br><span class="small">${d}</span>`;c.onclick=()=>{applyUpgrade(id);ui.levelPanel.classList.add('hidden');state='playing'};ui.levelCards.appendChild(c)}}
function applyUpgrade(id){if(id==='damage')player.damage*=1.15;if(id==='rate')player.fireRate*=1.12;if(id==='hp'){player.maxHp+=20;player.hp=Math.min(player.maxHp,player.hp+20)}if(id==='speed')player.moveBoost*=1.12;if(id==='burn')player.burnBoost*=1.5;if(id==='coins')coins+=Math.floor(coins*.2);if(id==='dash')player.dashCooldown*=.75;if(id==='melee')player.meleeDamage*=1.2}
function update(dt){if(state==='menu'||state==='gameover')return;if(state==='shop'){ui.shopTimer.textContent='下一波准备：'+Math.max(0,Math.ceil((shopUntil-performance.now())/1000))+' 秒';if(performance.now()>shopUntil){state='playing';ui.shopPanel.classList.add('hidden');wave++;waveTransition=false;startWave()}return}if(state==='level')return;playTime+=dt;invuln=Math.max(0,invuln-dt);attackTimer=Math.max(0,attackTimer-dt);fireTimer=Math.max(0,fireTimer-dt);dashTimer=Math.max(0,dashTimer-dt);if(reloadTimer>0){reloadTimer-=dt;if(reloadTimer<=0)player.mag[selectedWeapon]=player.maxMag[selectedWeapon]}if(keys.has('shift')&&!keys._shiftUsed){keys._shiftUsed=true;dash()}if(!keys.has('shift'))keys._shiftUsed=false;if(keys.has(' ')&&!keys._spaceUsed){keys._spaceUsed=true;melee()}if(!keys.has(' '))keys._spaceUsed=false;if(keys.has('1'))selectedWeapon=1;if(keys.has('2'))selectedWeapon=2;if(keys.has('3'))selectedWeapon=3;if(keys.has('4'))selectedWeapon=4;if(keys.has('5'))selectedWeapon=5;let mx=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0),my=(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0);let l=Math.hypot(mx,my)||1;if(player.dashTime>0){player.dashTime-=dt;moveEntity(player,player._dx*700,player._dy*700,dt/1000)}else if(mx||my)moveEntity(player,mx/l*player.speed*player.moveBoost,my/l*player.speed*player.moveBoost,dt/1000);if(mouse.down&&fireTimer<=0)shoot();spawnTimer-=dt;if(!waveTransition&&waveKills<waveTotal&&spawnTimer<=0){spawnRandomZombie();spawnTimer=Math.max(420,900-wave*18)}if(!waveTransition&&waveKills>=waveTotal&&zombies.length===0&&!boss)endWave();updateBullets(dt);updateZombies(dt);updateBoss(dt);updateGrenades(dt);updateDrops(dt);updatePowerups(dt);updateParticles(dt);updateTexts(dt);if(shake>0)shake=Math.max(0,shake-dt);camera.x=Math.max(0,Math.min(WORLD.w-W,player.x-W/2));camera.y=Math.max(0,Math.min(WORLD.h-H,player.y-H/2))}
function updateBullets(dt){for(const b of bullets){b.x+=b.vx*dt/1000;b.y+=b.vy*dt/1000;b.life-=dt;if(blocked(b.x,b.y,3))b.life=0;for(const z of zombies){if(b.life<=0)break;if(z.hp<=0||b.hit.has(z))continue;if(Math.hypot(b.x-z.x,b.y-z.y)<z.r+5){b.hit.add(z);damageZombie(z,b.damage);if(b.type===4){z.burnUntil=performance.now()+5000*player.burnBoost;z.burnTick=0}if(--b.pierce<=0)b.life=0}}if(b.life>0&&boss&&Math.hypot(b.x-boss.x,b.y-boss.y)<boss.r+5){if(!b.hit.has(boss)){b.hit.add(boss);boss.hp-=b.damage;if(b.type!==5)b.life=0}}}bullets=bullets.filter(b=>b.life>0)}
function updateZombies(dt){const now=performance.now();for(const z of zombies){if(z.hp<=0)continue;if(z.burnUntil>now){z.burnTick-=dt;if(z.burnTick<=0){damageZombie(z,2.5*player.damage*player.burnBoost);z.burnTick=600}}if(z.hp<=0)continue;z.stun=Math.max(0,z.stun-dt);z.attack=Math.max(0,z.attack-dt);let dx=player.x-z.x,dy=player.y-z.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d;let sp=z.speed*(z.type==='hunter'?1.15:1);if(z.type==='leaper'){z.jump=Math.max(0,z.jump-dt);if(d<260&&z.jump<=0){z.jump=1800;z._leapX=player.x;z._leapY=player.y}}if(z.jump>0&&z.jump<1500&&z.type==='leaper'){ux=(z._leapX-z.x)/(Math.hypot(z._leapX-z.x,z._leapY-z.y)||1);uy=(z._leapY-z.y)/(Math.hypot(z._leapX-z.x,z._leapY-z.y)||1);sp=220}if(z.type==='spitter'&&d<420){sp=0;if(z.attack<=0){z.attack=1600;enemyShot(z)}}if(z.stun<=0&&sp>0){let tryDirs=[[ux,uy],[uy,-ux],[-uy,ux],[-ux,-uy]];let moved=false;for(const [vx,vy] of tryDirs){const ox=z.x,oy=z.y;moveEntity(z,vx*sp,vy*sp,dt/1000);if(Math.hypot(z.x-ox,z.y-oy)>0.1){moved=true;break}}if(!moved){z.x+=(-uy)*12;z.y+=ux*12}}if(d<z.r+player.r+3&&z.attack<=0&&z.type!=='spitter'){damagePlayer(z.damage*(z.type==='exploder'?.15:.04));z.attack=700;if(z.type==='exploder'){for(const q of zombies)if(q!==z&&Math.hypot(q.x-z.x,q.y-z.y)<100)damageZombie(q,30);z.hp=0}}}zombies=zombies.filter(z=>z.hp>0)}
function enemyShot(z){const a=Math.atan2(player.y-z.y,player.x-z.x);bullets.push({x:z.x,y:z.y,vx:Math.cos(a)*320,vy:Math.sin(a)*320,life:1600,damage:12,type:'enemy',pierce:1,hit:new Set()})}
function updateBoss(dt){if(!boss)return;if(boss.hp<=0){score+=2000;coins+=250;gainXP(200);showMessage('👑 BOSS DEFEATED +$250',2200);for(let i=0;i<30;i++)particles.push({x:boss.x,y:boss.y,vx:(Math.random()-.5)*300,vy:(Math.random()-.5)*300,life:900,color:'#ffcc45',size:3+Math.random()*4});boss=null;return}boss.phase=boss.hp<boss.maxHp*.33?3:boss.hp<boss.maxHp*.66?2:1;const d=Math.hypot(player.x-boss.x,player.y-boss.y)||1;const a=Math.atan2(player.y-boss.y,player.x-boss.x);boss.attack-=dt;boss.shoot-=dt;if(d>115)moveEntity(boss,Math.cos(a)*(45+boss.phase*20),Math.sin(a)*(45+boss.phase*20),dt/1000);if(d<boss.r+player.r+12&&boss.attack<=0){damagePlayer(18+boss.phase*4);boss.attack=700}if(boss.shoot<=0){boss.shoot=boss.phase===3?700:1200;for(let i=0;i<boss.phase;i++){const aa=a+(i-(boss.phase-1)/2)*.18;bullets.push({x:boss.x,y:boss.y,vx:Math.cos(aa)*360,vy:Math.sin(aa)*360,life:1800,damage:14+boss.phase*4,type:'enemy',pierce:1,hit:new Set()})}if(boss.phase>=2){spawnRandomZombie();spawnRandomZombie()}}}
function updateGrenades(dt){for(const g of grenades){g.x+=g.vx*dt/1000;g.y+=g.vy*dt/1000;g.vx*=.985;g.vy*=.985;g.life-=dt;if(g.life<=0){for(const z of zombies)if(Math.hypot(z.x-g.x,z.y-g.y)<145)damageZombie(z,110*player.damage);for(let i=0;i<24;i++)particles.push({x:g.x,y:g.y,vx:(Math.random()-.5)*260,vy:(Math.random()-.5)*260,life:550,color:'#ffad43',size:3+Math.random()*4})}}grenades=grenades.filter(g=>g.life>0)}
function updateDrops(dt){for(const d of drops){d.life-=dt;if(Math.hypot(d.x-player.x,d.y-player.y)<28){if(d.type==='hp')player.hp=Math.min(player.maxHp,player.hp+25);if(d.type==='grenade')player.grenades++;if(d.type==='coin')coins+=30;if(d.type==='ammo')player.mag[selectedWeapon]=player.maxMag[selectedWeapon];d.life=0}}drops=drops.filter(d=>d.life>0)}
function updatePowerups(dt){for(const p of powerups){p.life-=dt;if(Math.hypot(p.x-player.x,p.y-player.y)<30){p.life=0;if(p.type==='heal')player.hp=Math.min(player.maxHp,player.hp+45);if(p.type==='rage')player.fireRate*=1.35,setTimeout(()=>player.fireRate/=1.35,10000);if(p.type==='freeze')for(const z of zombies)z.stun=5000;if(p.type==='insta')for(const z of zombies)if(z.type==='normal'||z.type==='fast'||z.type==='hunter')damageZombie(z,99999);showMessage('⚡ POWER-UP!',900)}}powerups=powerups.filter(p=>p.life>0)}
function updateParticles(dt){for(const p of particles){p.x+=p.vx*dt/1000;p.y+=p.vy*dt/1000;p.vx*=.98;p.vy*=.98;p.life-=dt}particles=particles.filter(p=>p.life>0)}function updateTexts(dt){for(const t of texts){t.y-=18*dt/1000;t.life-=dt}texts=texts.filter(t=>t.life>0)}
function gameOver(){state='gameover';dna+=Math.floor(wave*4+kills/10);localStorage.setItem('zo_dna',dna);localStorage.setItem('zo_kills',totalKills);ui.gameOverStats.innerHTML=`坚持到 <b>Wave ${wave}</b> · 击杀 ${kills} · 得分 ${score} · 获得 🧬 DNA ${Math.floor(wave*4+kills/10)}<br>累计击杀 ${totalKills} · 永久 DNA ${dna}`;ui.gameOverPanel.classList.remove('hidden')}
function closeOverlays(){if(state==='level'){ui.levelPanel.classList.add('hidden');state='playing'}if(state==='shop'){ui.shopPanel.classList.add('hidden');state='playing'}}
document.getElementById('startBtn').onclick=resetGame;document.getElementById('restartBtn').onclick=resetGame;document.getElementById('endlessBtn').onclick=()=>{endless=true;resetGame()};
function showMessage(t,ms=1200){ui.message.textContent=t;ui.message.style.opacity=1;clearTimeout(showMessage.timer);showMessage.timer=setTimeout(()=>ui.message.style.opacity=0,ms)}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#0a1510';ctx.fillRect(0,0,W,H);ctx.save();let sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;ctx.translate(-camera.x+sx,-camera.y+sy);drawWorld();drawDrops();drawPowerups();for(const g of grenades)drawGrenade(g);for(const b of bullets)drawBullet(b);for(const z of zombies)drawZombie(z);if(boss)drawBoss();drawPlayer();drawParticles();drawTexts();ctx.restore();drawVignette();updateUI()}
function drawWorld(){ctx.fillStyle='#122019';ctx.fillRect(0,0,WORLD.w,WORLD.h);ctx.strokeStyle='#263d32';ctx.lineWidth=2;for(let x=0;x<WORLD.w;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,WORLD.h);ctx.stroke()}for(let y=0;y<WORLD.h;y+=80){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(WORLD.w,y);ctx.stroke()}for(const a of walls){ctx.fillStyle='#303b37';ctx.fillRect(a.x,a.y,a.w,a.h);ctx.fillStyle='#46534e';ctx.fillRect(a.x+5,a.y+5,a.w-10,8);ctx.strokeStyle='#151d19';ctx.strokeRect(a.x,a.y,a.w,a.h)}}
function drawPlayer(){const a=aim(),moving=keys.has('w')||keys.has('a')||keys.has('s')||keys.has('d')||keys.has('arrowup')||keys.has('arrowdown')||keys.has('arrowleft')||keys.has('arrowright'),t=performance.now()/100;ctx.save();ctx.translate(player.x,player.y);ctx.rotate(a);ctx.globalAlpha=invuln>0&&Math.floor(invuln/70)%2===0?.45:1;ctx.fillStyle='#0008';ctx.beginPath();ctx.ellipse(0,18,20,8,0,0,Math.PI*2);ctx.fill();let leg=Math.sin(t*2.4)*(moving?6:1);ctx.strokeStyle='#18232a';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-7,8);ctx.lineTo(-8+leg,23);ctx.moveTo(7,8);ctx.lineTo(8-leg,23);ctx.stroke();ctx.fillStyle='#536a82';ctx.fillRect(-11,-4,22,19);ctx.fillStyle='#e2b08b';ctx.beginPath();ctx.arc(0,-16,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#3a2c28';ctx.beginPath();ctx.arc(0,-20,10,Math.PI,Math.PI*2);ctx.fill();ctx.strokeStyle='#e2b08b';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(6,-1);ctx.lineTo(17,4);ctx.stroke();ctx.fillStyle='#252a2b';ctx.fillRect(14,1,30,6);ctx.fillStyle='#d4d9d5';ctx.fillRect(40,1,7,6);ctx.restore();if(attackTimer>250){ctx.save();ctx.translate(player.x,player.y);ctx.rotate(a);ctx.strokeStyle='#f6e2a4';ctx.lineWidth=6;ctx.beginPath();ctx.arc(20,0,65,-.8,.8);ctx.stroke();ctx.restore()}}
function drawZombie(z){ctx.save();ctx.translate(z.x,z.y);const moving=performance.now()/100;ctx.fillStyle='#0007';ctx.beginPath();ctx.ellipse(0,z.r*.75,z.r*.8,z.r*.3,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#1c2a23';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-z.r*.35,z.r*.45);ctx.lineTo(-z.r*.55,z.r*.9);ctx.moveTo(z.r*.35,z.r*.45);ctx.lineTo(z.r*.55,z.r*.9);ctx.stroke();ctx.fillStyle=z.color;ctx.fillRect(-z.r*.65,-z.r*.25,z.r*1.3,z.r*1.1);ctx.fillStyle='#7c9b78';ctx.beginPath();ctx.arc(0,-z.r*.55,z.r*.62,0,Math.PI*2);ctx.fill();ctx.fillStyle='#382d25';ctx.beginPath();ctx.arc(0,-z.r*.8,z.r*.6,Math.PI,Math.PI*2);ctx.fill();ctx.strokeStyle='#7c9b78';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-z.r*.55,0);ctx.lineTo(-z.r*.95,10+Math.sin(moving)*4);ctx.moveTo(z.r*.55,0);ctx.lineTo(z.r*.95,10-Math.sin(moving)*4);ctx.stroke();ctx.fillStyle='#e33';ctx.beginPath();ctx.arc(-z.r*.22,-z.r*.62,2.8,0,Math.PI*2);ctx.arc(z.r*.22,-z.r*.62,2.8,0,Math.PI*2);ctx.fill();if(z.type==='tank'){ctx.strokeStyle='#98a7b2';ctx.lineWidth=5;ctx.strokeRect(-z.r*.7,-z.r*.15,z.r*1.4,z.r*.85)}if(z.type==='spitter'){ctx.fillStyle='#65e5a5';ctx.beginPath();ctx.arc(0,-z.r*.2,6,0,Math.PI*2);ctx.fill()}if(z.type==='leaper'){ctx.strokeStyle='#f3c75f';ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(0,0,z.r+6,0,Math.PI*2);ctx.stroke();ctx.setLineDash([])}if(z.type==='exploder'){ctx.strokeStyle='#ff7438';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,z.r+7,0,Math.PI*2);ctx.stroke()}ctx.restore();if(z.hp<z.maxHp){ctx.fillStyle='#1c2722';ctx.fillRect(z.x-z.r,z.y-z.r-17,z.r*2,4);ctx.fillStyle='#e25353';ctx.fillRect(z.x-z.r,z.y-z.r-17,z.r*2*Math.max(0,z.hp/z.maxHp),4)}}
function drawBoss(){ctx.save();ctx.translate(boss.x,boss.y);ctx.fillStyle='#0009';ctx.beginPath();ctx.ellipse(0,50,65,22,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=boss.phase===3?'#9e2222':'#5b3035';ctx.beginPath();ctx.arc(0,0,boss.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#e1b84d';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(-30,-35);ctx.lineTo(-20,-75);ctx.lineTo(-5,-48);ctx.lineTo(12,-78);ctx.lineTo(28,-34);ctx.stroke();ctx.fillStyle='#ffdd55';ctx.beginPath();ctx.arc(-20,-12,6,0,Math.PI*2);ctx.arc(20,-12,6,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#f16b4f';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-45,5);ctx.lineTo(-75,30);ctx.moveTo(45,5);ctx.lineTo(75,30);ctx.stroke();ctx.restore();ctx.fillStyle='#1c2722';ctx.fillRect(boss.x-75,boss.y-boss.r-25,150,10);ctx.fillStyle=boss.phase===3?'#f23a3a':'#c33b48';ctx.fillRect(boss.x-75,boss.y-boss.r-25,150*Math.max(0,boss.hp/boss.maxHp),10);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 15px Arial';ctx.fillText('👑 BOSS · PHASE '+boss.phase,boss.x,boss.y-boss.r-32)}
function drawBullet(b){ctx.fillStyle=b.type==='enemy'?'#ff675c':(weapons[b.type]?.color||'#fff');ctx.beginPath();ctx.arc(b.x,b.y,b.type===5?4:3,0,Math.PI*2);ctx.fill()}
function drawGrenade(g){ctx.fillStyle='#25362c';ctx.beginPath();ctx.arc(g.x,g.y,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d9c28b';ctx.fillRect(g.x-2,g.y-11,4,4)}
function drawDrops(){for(const d of drops){const bob=Math.sin(performance.now()/160+d.x)*4;ctx.save();ctx.translate(d.x,d.y+bob);ctx.fillStyle='#0007';ctx.beginPath();ctx.ellipse(0,12,15,6,0,0,Math.PI*2);ctx.fill();if(d.type==='hp'){ctx.fillStyle='#e8eee9';ctx.fillRect(-12,-10,24,22);ctx.fillStyle='#d53f4c';ctx.fillRect(-4,-8,8,18);ctx.fillRect(-9,-3,18,8)}if(d.type==='ammo'){ctx.fillStyle='#c99d4d';ctx.fillRect(-13,-10,26,20);ctx.fillStyle='#55422a';for(let i=-8;i<=8;i+=8)ctx.fillRect(i,-7,4,14)}if(d.type==='grenade'){ctx.fillStyle='#3f5746';ctx.beginPath();ctx.arc(0,2,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d6c185';ctx.fillRect(-2,-12,4,5)}if(d.type==='coin'){ctx.fillStyle='#f3c64f';ctx.beginPath();ctx.arc(0,0,11,0,Math.PI*2);ctx.fill();ctx.fillStyle='#9a6c1f';ctx.font='bold 12px Arial';ctx.textAlign='center';ctx.fillText('$',0,4)}ctx.restore()}}
function drawPowerups(){for(const p of powerups){const y=p.y+Math.sin(performance.now()/180)*5;ctx.save();ctx.translate(p.x,y);ctx.fillStyle=p.type==='rage'?'#f05':p.type==='freeze'?'#61cfff':p.type==='heal'?'#68df85':'#ffd34e';ctx.beginPath();ctx.arc(0,0,14,0,Math.PI*2);ctx.fill();ctx.fillStyle='#07100d';ctx.font='bold 13px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.type==='rage'?'R':p.type==='freeze'?'F':p.type==='heal'?'+':'K',0,0);ctx.restore()}}
function drawParticles(){for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/600);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}
function drawTexts(){ctx.textAlign='center';ctx.font='bold 14px Arial';for(const t of texts){ctx.globalAlpha=Math.max(0,t.life/520);ctx.fillStyle=t.color;ctx.fillText(t.t,t.x,t.y)}ctx.globalAlpha=1}
function drawVignette(){const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.25,W/2,H/2,Math.max(W,H)*.7);g.addColorStop(0,'transparent');g.addColorStop(1,'#0009');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
function updateUI(){ui.hpText.textContent=Math.ceil(player.hp)+' / '+player.maxHp;ui.hpBar.style.width=Math.max(0,player.hp/player.maxHp*100)+'%';ui.xpText.textContent=Math.floor(xp)+' / '+xpNeed;ui.xpBar.style.width=(xp/xpNeed*100)+'%';ui.stats.innerHTML=`🌊 Wave ${wave} · ☠️ ${waveKills}/${waveTotal} · ⭐ Lv.${level}<br>💰 ${coins} · 🧬 ${dna} · 🏆 ${score}`;ui.weaponText.textContent=`🔫 ${weapons[selectedWeapon].name} [${selectedWeapon}]`;ui.ammoText.textContent=`弹匣 ${player.mag[selectedWeapon]}/${player.maxMag[selectedWeapon]} ${reloadTimer>0?'🔄':''}`;ui.dashText.textContent=`⚡ Dash ${player.dashCooldown>0?Math.ceil(player.dashCooldown/1000)+'s':'READY'}`;ui.grenadeText.textContent=`💣 ${player.grenades} · Space 近战`}
function loop(ts){const dt=Math.min(40,ts-last);last=ts;update(dt);draw();requestAnimationFrame(loop)}
ui.menuPanel.classList.remove('hidden');requestAnimationFrame(loop);
})();
</script>
