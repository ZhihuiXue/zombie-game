for(let z of zombies){z.attackCd=Math.max(0,(z.attackCd||0)-dt);z.leapCd=Math.max(0,(z.leapCd||0)-dt);let a=Math.atan2(player.y-z.y,player.x-z.x),speed=z.speed;if(z.type==='fast')speed*=1.25;if(z.type==='hunter')speed*=1.15;if(z.type==='exploder'&&dist(z,player)<70){z.hp=0;damagePlayer(35)}if(z.type==='spitter'&&dist(z,player)<520){speed*=.35;if(z.attackCd<=0){z.attackCd=1900;bullets.push({x:z.x,y:z.y,vx:Math.cos(a)*430,vy:Math.sin(a)*430,damage:10,life:1800,hit:new Set(),enemy:true,color:'#7dff63'})}}if(z.type==='leaper'&&z.leapCd<=0&&dist(z,player)>120&&dist(z,player)<520){z.leapCd=2200;z.x=clamp(player.x-Math.cos(a)*80,40,world.w-40);z.y=clamp(player.y-Math.sin(a)*80,40,world.h-40);damagePlayer(12)}const step=speed*dt/1000;const moved=moveZombieSmart(z,Math.cos(a)*step,Math.sin(a)*step);z.stuck=moved?0:(z.stuck||0)+dt;if(z.stuck>700){const escape=a+((Math.random()<.5?1:-1)*Math.PI/2);moveEntity(z,Math.cos(escape)*Math.min(24,step+8),Math.sin(escape)*Math.min(24,step+8));z.stuck=0}z.walk+=dt*.01;if(dist(z,player)<z.r+player.r)damagePlayer(z.damage);if(z.burnUntil>performance.now()){z.burnTick+=dt;if(z.burnTick>600){z.hp-=2.5*player.damage;z.burnTick=0}}}for(let z of zombies.filter(z=>z.dead||z.hp<=0))killZombie(z);zombies=zombies.filter(z=>!z.dead&&z.hp>0);
if(boss){boss.attackCd=Math.max(0,boss.attackCd-dt);boss.shotCd=Math.max(0,boss.shotCd-dt);let ratio=boss.hp/boss.maxHp;if(ratio<.66&&boss.phase===1){boss.phase=2;boss.speed*=1.25;texts.push({x:boss.x,y:boss.y-90,t:'⚠️ BOSS PHASE 2',life:1600,big:1})}if(ratio<.33&&boss.phase===2){boss.phase=3;boss.speed*=1.35;boss.damage*=1.35;texts.push({x:boss.x,y:boss.y-90,t:'☠️ BOSS ENRAGED',life:1600,big:1})}let a=Math.atan2(player.y-boss.y,player.x-boss.x);moveEntity(boss,Math.cos(a)*boss.speed*dt/1000,Math.sin(a)*boss.speed*dt/1000);if(boss.shotCd<=0){boss.shotCd=boss.phase===3?1300:2100;for(let k=-1;k<=1;k++){let aa=a+k*.22;bullets.push({x:boss.x,y:boss.y,vx:Math.cos(aa)*360,vy:Math.sin(aa)*360,damage:12+boss.phase*4,life:1800,hit:new Set(),enemy:true,color:'#ff5d5d'})}}if(boss.attackCd<=0&&boss.phase>=2){boss.attackCd=2600;for(let i=0;i<(boss.phase===3?4:2);i++)spawnZombie()}if(dist(boss,player)<boss.r+player.r)damagePlayer(boss.damage);if(boss.hp<=0){player.coins+=Math.round(300*(player.coinMult||1));score+=1000;dna+=25;boss=null;waveKills=waveTotal;for(let i=0;i<40;i++)particles.push({x:player.x,y:player.y,vx:(Math.random()-.5)*500,vy:(Math.random()-.5)*500,life:700,color:'#ffd166',r:3+Math.random()*5})}}

for(let p of particles){p.x+=p.vx*dt/1000;p.y+=p.vy*dt/1000;p.life-=dt;p.vx*=.98;p.vy*=.98}particles=particles.filter(p=>p.life>0);for(let t of texts){t.life-=dt;t.y-=20*dt/1000}texts=texts.filter(t=>t.life>0);
if(waveKills>=waveTotal&&zombies.length===0&&!boss&&!waveTransition){waveTransition=true;player.coins+=50;texts.push({x:player.x,y:player.y-90,t:'🎉 WAVE '+wave+' COMPLETE +$50',life:2500,big:1});setTimeout(openShop,700)} }
function circle(x,y,r,fill,stroke){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}

function drawZombie(z){let a=Math.atan2(player.y-z.y,player.x-z.x),s=z.scale;ctx.save();ctx.translate(z.x,z.y);ctx.scale(s,s);ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(0,17,17,7,0,0,Math.PI*2);ctx.fill();let body=z.type==='tank'?'#59636b':z.type==='fast'?'#9a6a39':z.type==='exploder'?'#73502f':'#49624f';ctx.fillStyle=body;ctx.fillRect(-10,-1,20,25);ctx.fillStyle='#78936e';ctx.beginPath();ctx.arc(0,-11,11,0,Math.PI*2);ctx.fill();ctx.fillStyle='#3a2a21';ctx.beginPath();ctx.arc(-3,-16,10,Math.PI,Math.PI*2);ctx.fill();ctx.strokeStyle='#2d3c33';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-9,4);ctx.lineTo(-19,12);ctx.moveTo(9,4);ctx.lineTo(19,10);ctx.stroke();ctx.fillStyle='#e8e8d5';ctx.fillRect(-6,-10,4,3);ctx.fillRect(3,-10,4,3);ctx.fillStyle='#b22222';ctx.fillRect(-5,-3,10,3);ctx.fillStyle='#29342c';ctx.fillRect(-9,22,7,11);ctx.fillRect(2,22,7,11);if(z.type==='fast'){ctx.strokeStyle='#ffd166';ctx.lineWidth=2;ctx.strokeRect(-14,-28,28,4)}if(z.type==='tank'){ctx.fillStyle='#7f8b93';ctx.fillRect(-14,-1,6,18);ctx.fillRect(8,-1,6,18)}if(z.type==='exploder'){ctx.strokeStyle='#ff8a32';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,18+Math.sin(performance.now()/80)*2,0,Math.PI*2);ctx.stroke()}if(z.type==='hunter'){ctx.fillStyle='#4b7db8';ctx.beginPath();ctx.moveTo(-15,2);ctx.lineTo(0,-10);ctx.lineTo(15,2);ctx.fill()}if(z.type==='spitter'){ctx.fillStyle='#6be06b';ctx.beginPath();ctx.arc(0,-2,5,0,Math.PI*2);ctx.fill();ctx.fillRect(-6,0,12,5)}if(z.type==='leaper'){ctx.strokeStyle='#d7a0ff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,21+Math.sin(performance.now()/100)*3,0,Math.PI*2);ctx.stroke()}ctx.restore();if(z.burnUntil>performance.now()){circle(z.x-9,z.y-15,5,'#ff9d32');circle(z.x+8,z.y-12,4,'#ffd166')}ctx.fillStyle='#111';ctx.fillRect(z.x-18,z.y-z.r-12,36,4);ctx.fillStyle='#65d36e';ctx.fillRect(z.x-18,z.y-z.r-12,36*Math.max(0,z.hp/z.max),4)}
function drawBoss(){if(!boss)return;ctx.save();ctx.translate(boss.x,boss.y);ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(0,45,60,20,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#572020';ctx.beginPath();ctx.arc(0,5,56,0,Math.PI*2);ctx.fill();ctx.fillStyle='#9b2c2c';ctx.fillRect(-38,-8,76,65);ctx.fillStyle='#d9a477';ctx.beginPath();ctx.arc(0,-42,29,0,Math.PI*2);ctx.fill();ctx.fillStyle='#2c1c1c';ctx.beginPath();ctx.moveTo(-25,-58);ctx.lineTo(-42,-92);ctx.lineTo(-8,-67);ctx.moveTo(25,-58);ctx.lineTo(42,-92);ctx.lineTo(8,-67);ctx.fill();ctx.fillStyle='#ffdd66';ctx.fillRect(-15,-46,9,6);ctx.fillRect(7,-46,9,6);ctx.fillStyle='#111';ctx.fillRect(-11,-28,22,6);ctx.restore();ctx.fillStyle='#180909';ctx.fillRect(boss.x-75,boss.y-105,150,12);ctx.fillStyle='#e33';ctx.fillRect(boss.x-75,boss.y-105,150*Math.max(0,boss.hp/boss.maxHp),12);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 16px Arial';ctx.fillText('👑 BOSS',boss.x,boss.y-112)}
function drawDrop(d){let bob=Math.sin(performance.now()/180+d.x)*4;ctx.save();ctx.translate(d.x,d.y+bob);circle(0,0,17,'rgba(0,0,0,.25)');if(d.type==='hp'){ctx.fillStyle='#e84b4b';ctx.fillRect(-13,-10,26,20);ctx.fillStyle='#fff';ctx.fillRect(-4,-8,8,16);ctx.fillRect(-8,-4,16,8)}else if(d.type==='ammo'){ctx.fillStyle='#d5ad44';ctx.fillRect(-13,-9,26,18);ctx.fillStyle='#333';ctx.fillRect(-8,-6,4,12);ctx.fillRect(1,-6,4,12)}else if(d.type==='grenade'){circle(0,2,10,'#3e4d42');ctx.fillStyle='#c0c0a0';ctx.fillRect(-2,-12,5,7)}else{circle(0,0,12,'#e6b93f');ctx.fillStyle='#fff0a0';ctx.font='bold 12px Arial';ctx.textAlign='center';ctx.fillText('$',0,4)}ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#15221d';ctx.fillRect(0,0,W,H);let q=cam();ctx.save();ctx.translate(-q.x,-q.y);ctx.fillStyle='#1a2b24';ctx.fillRect(0,0,world.w,world.h);ctx.strokeStyle='rgba(255,255,255,.035)';for(let x=0;x<world.w;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,world.h);ctx.stroke()}for(let y=0;y<world.h;y+=80){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(world.w,y);ctx.stroke()}for(let o of obstacles){ctx.fillStyle='#3b4a43';ctx.fillRect(o.x,o.y,o.w,o.h);ctx.strokeStyle='#596b61';ctx.strokeRect(o.x,o.y,o.w,o.h)}for(let d of drops)drawDrop(d);for(let p of powerups){let yy=p.y+Math.sin(performance.now()/140+p.x)*5;circle(p.x,yy,18,'rgba(120,255,190,.18)');circle(p.x,yy,10,p.type==='rage'?'#ff4b4b':p.type==='freeze'?'#62d9ff':p.type==='heal'?'#7dff8a':'#ffd34d');ctx.fillStyle='#111';ctx.font='bold 10px Arial';ctx.textAlign='center';ctx.fillText(p.type==='rage'?'R':p.type==='freeze'?'F':p.type==='heal'?'+':'K',p.x,yy+4)}for(let g of grenades)circle(g.x,g.y,8,'#364b3d');for(let b of bullets){ctx.fillStyle=b.color;ctx.fillRect(b.x-3,b.y-2,8,4)}for(let p of particles){ctx.globalAlpha=Math.max(0,p.life/500);circle(p.x,p.y,p.r,p.color);ctx.globalAlpha=1}for(let z of zombies)drawZombie(z);drawBoss();drawPlayer();ctx.restore();drawUI();for(let t of texts){ctx.save();ctx.textAlign='center';ctx.font=t.big?'bold 28px Arial':'bold 18px Arial';ctx.fillStyle=t.big?'#ffd166':'#fff';ctx.fillText(t.t,t.x-q.x,t.y-q.y);ctx.restore()} }
function drawUI(){ctx.fillStyle='rgba(5,10,8,.75)';ctx.fillRect(12,12,320,120);ctx.fillStyle='#fff';ctx.font='bold 16px Arial';ctx.fillText(`WAVE ${wave}   ${wave%5===0?'👑 BOSS':''}`,25,36);ctx.fillText(`${getWeapon().name}  ${player.mag}/${getWeapon().mag}${player.reload>0?'  ⏳换弹':''}`,25,60);ctx.fillText(`❤️ ${Math.ceil(player.hp)}/${player.maxHp}  💰 $${player.coins}  💣 ${player.grenades}`,25,84);ctx.fillText(`☠ ${waveKills}/${waveTotal}   XP ${player.xp}   Lv.${player.level}   🧬 ${dna}`,25,108);ctx.fillStyle='#8ff0ad';ctx.fillText(`Shift: Dash ${player.dashCd>0?'⏳':'READY'}   M: 永久升级`,25,130);let mw=180,mx=W-200,my=20;ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(mx,my,mw,125);let sx=mw/world.w,sy=125/world.h;ctx.fillStyle='#4d665b';for(let o of obstacles)ctx.fillRect(mx+o.x*sx,my+o.y*sy,o.w*sx,o.h*sy);ctx.fillStyle='#ffdf65';ctx.fillRect(mx+player.x*sx-2,my+player.y*sy-2,4,4);ctx.fillStyle='#d9534f';for(let z of zombies)ctx.fillRect(mx+z.x*sx-1,my+z.y*sy-1,3,3);if(boss){ctx.fillStyle='#ffcc44';ctx.fillRect(mx+boss.x*sx-3,my+boss.y*sy-3,6,6)} }
function loop(t){let dt=Math.min(40,t-last);last=t;update(dt);draw();requestAnimationFrame(loop)}startWave();requestAnimationFrame(loop);
