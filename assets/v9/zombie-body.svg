<svg xmlns="http://www.w3.org/2000/svg" width="512" height="128" viewBox="0 0 512 128">
<defs>
 <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c98f7b"/><stop offset=".55" stop-color="#754b45"/><stop offset="1" stop-color="#332b2a"/></linearGradient>
 <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#48504b"/><stop offset="1" stop-color="#171c1b"/></linearGradient>
 <linearGradient id="blood" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9d2424"/><stop offset="1" stop-color="#421416"/></linearGradient>
 <filter id="shadow"><feGaussianBlur stdDeviation="1.2"/></filter>
 <g id="upper" stroke="#171313" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
   <path d="M43 42 Q64 31 83 44 L88 78 Q77 88 62 86 Q47 86 38 76Z" fill="url(#cloth)"/>
   <path d="M48 47 L55 78 M78 46 L73 80" stroke="#69716a" opacity=".55"/>
   <path d="M43 57 l14 7 -6 8 -12 -7zM78 57 l12 -5 2 9 -13 7z" fill="#343b37"/>
   <path d="M49 67 l10 5 -5 10 -9 -8zM72 65 l11 3 -3 14 -10 -6z" fill="#121716"/>
   <path d="M55 38 L55 48 Q64 54 73 47 L72 37Z" fill="#8b5a52"/>
   <path d="M47 16 Q61 5 77 14 Q88 22 82 39 Q74 50 60 48 Q45 44 43 31 Q42 21 47 16Z" fill="url(#skin)"/>
   <path d="M45 23 Q48 8 63 8 Q78 7 83 21 L76 18 70 23 61 17 53 24Z" fill="#171817"/>
   <path d="M48 30 l11 3 M75 28 l6 -2 M58 40 l12 0" stroke="#d9a092" opacity=".65"/>
   <path d="M57 29 q3 -3 6 0 M72 28 q3 -2 6 1" stroke="#160f10" stroke-width="3"/>
   <circle cx="61" cy="29" r="2.2" fill="#e2c0a0" stroke="none"/><circle cx="75" cy="29" r="2.2" fill="#e2c0a0" stroke="none"/>
   <path d="M57 36 Q66 42 76 35 Q69 47 59 40Z" fill="#160f10"/>
   <path d="M60 38 l2 4 M65 39 l1 4 M70 38 l-1 4" stroke="#d6c4b5" stroke-width="1.5"/>
   <path d="M80 17 q-7 7 -3 15" stroke="url(#blood)" stroke-width="4" fill="none"/>
 </g>
 <g id="legL" stroke="#171313" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
   <path d="M48 76 L39 103 L34 115 L47 116 L57 102 L62 83Z" fill="#252b2a"/>
   <path d="M32 113 l17 0 -2 6 -19 0z" fill="#111"/>
 </g>
 <g id="legR" stroke="#171313" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
   <path d="M70 78 L72 101 L79 114 L93 113 L84 97 L82 77Z" fill="#202524"/>
   <path d="M77 112 l17 -1 5 6 -21 1z" fill="#111"/>
 </g>
 <g id="armL" stroke="#171313" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
   <path d="M43 49 Q30 54 25 69 L18 80 L27 86 L39 72 L51 61Z" fill="url(#skin)"/>
   <path d="M17 78 l11 2 3 8 -8 7 -8 -6z" fill="#a56f63"/>
 </g>
 <g id="armR" stroke="#171313" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
   <path d="M84 49 Q98 53 101 67 L108 78 L99 85 L88 72 L77 61Z" fill="url(#skin)"/>
   <path d="M98 78 l10 -2 7 6 -7 8 -9 -4z" fill="#a56f63"/>
 </g>
</defs>

<!-- Frame 1: contact -->
<g transform="translate(0,0)">
 <ellipse cx="64" cy="116" rx="30" ry="6" fill="#000" opacity=".42" filter="url(#shadow)"/>
 <use href="#legL"/><use href="#legR"/><use href="#armL"/><use href="#armR"/><use href="#upper"/>
</g>

<!-- Frame 2: left leg forward, right leg back; arms counter-swing -->
<g transform="translate(128,0)">
 <ellipse cx="64" cy="116" rx="30" ry="6" fill="#000" opacity=".42" filter="url(#shadow)"/>
 <g transform="rotate(-11 49 82)"><use href="#legL"/></g>
 <g transform="rotate(11 80 82)"><use href="#legR"/></g>
 <g transform="rotate(9 42 54)"><use href="#armL"/></g>
 <g transform="rotate(-9 84 54)"><use href="#armR"/></g>
 <use href="#upper"/>
</g>

<!-- Frame 3: passing pose -->
<g transform="translate(256,0)">
 <ellipse cx="64" cy="116" rx="30" ry="6" fill="#000" opacity=".42" filter="url(#shadow)"/>
 <g transform="rotate(6 49 82)"><use href="#legL"/></g>
 <g transform="rotate(-6 80 82)"><use href="#legR"/></g>
 <g transform="rotate(-6 42 54)"><use href="#armL"/></g>
 <g transform="rotate(6 84 54)"><use href="#armR"/></g>
 <use href="#upper"/>
</g>

<!-- Frame 4: opposite stride -->
<g transform="translate(384,0)">
 <ellipse cx="64" cy="116" rx="30" ry="6" fill="#000" opacity=".42" filter="url(#shadow)"/>
 <g transform="rotate(11 49 82)"><use href="#legL"/></g>
 <g transform="rotate(-11 80 82)"><use href="#legR"/></g>
 <g transform="rotate(-9 42 54)"><use href="#armL"/></g>
 <g transform="rotate(9 84 54)"><use href="#armR"/></g>
 <use href="#upper"/>
</g>
</svg>